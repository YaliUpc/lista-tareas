<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas con Prioridades</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>📝 Mis Tareas</h1>

    <form id="task-form">
      <input type="text" id="task-title" placeholder="Título de la tarea" required />
      <textarea id="task-desc" placeholder="Descripción (opcional)"></textarea>
      <select id="task-priority">
        <option value="alta">🔴 Alta</option>
        <option value="media" selected>🟡 Media</option>
        <option value="baja">🟢 Baja</option>
      </select>
      <button type="submit">Agregar tarea</button>
    </form>

    <div class="filters">
      <button data-filter="all" class="active">Todas</button>
      <button data-filter="pending">Pendientes</button>
      <button data-filter="done">Completadas</button>
    </div>

    <ul id="task-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
